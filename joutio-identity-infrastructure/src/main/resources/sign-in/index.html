<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Joutio · Outils</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    /* Jetons du design system (design/tokens/tokens.json) : thème clair, puis sombre. */
    :root {
      color-scheme: light dark;
      --bg: #F6F5F1; --surface: #FFFFFF; --raised: #EFEDE7; --border: #D9D6CD;
      --text: #121210; --muted: #64625C; --accent: #E8B04A; --on-accent: #000000; --wrong: #A83A32;
      --radius-sm: 8px; --radius-lg: 16px; --radius-xl: 24px;
      font-family: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000; --surface: #181818; --raised: #242424; --border: #3A3A3A;
        --text: #FFFFFF; --muted: #9B9B9B; --accent: #E8B04A; --on-accent: #000000; --wrong: #E5645A;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); }
    main { width: 100%; max-width: 400px; display: grid; gap: 24px; padding: 32px 24px; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius-xl); }
    .brand { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
    .brand span { color: var(--muted); font-weight: 500; }
    h1 { margin: 0; font-size: 22px; line-height: 30px; font-weight: 600; letter-spacing: -0.02em; }
    p { margin: 0; color: var(--muted); font-size: 15px; line-height: 22px; }
    form { display: grid; gap: 12px; }
    label { font-size: 15px; font-weight: 500; }
    input { width: 100%; height: 48px; padding: 0 14px; border: 0; border-radius: var(--radius-sm); background: var(--raised);
      color: var(--text); font: inherit; font-size: 17px; box-shadow: inset 0 0 0 1px var(--border); }
    input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
    input[name="code"] { letter-spacing: 0.4em; font-variant-numeric: tabular-nums; }
    button, .google { height: 48px; border: 0; border-radius: 999px; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
    button[type="submit"] { background: var(--accent); color: var(--on-accent); }
    button[disabled] { opacity: 0.5; cursor: default; }
    .google { background: var(--raised); color: var(--text); box-shadow: inset 0 0 0 1px var(--border); }
    .link { background: none; height: auto; padding: 0; color: var(--muted); font-size: 15px; font-weight: 500; justify-self: start; }
    .divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .error { color: var(--wrong); font-size: 15px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <div class="brand">Joutio <span data-t="tools"></span></div>
  <div style="display: grid; gap: 8px">
    <h1 data-t="title"></h1>
    <p id="intro" data-t="intro"></p>
  </div>

  <p class="error" id="error" role="alert" hidden></p>

  <form id="email-form" novalidate>
    <label for="email" data-t="email"></label>
    <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required>
    <button type="submit" data-t="sendCode"></button>
  </form>

  <form id="code-form" novalidate hidden>
    <label for="code" data-t="code"></label>
    <input id="code" name="code" autocomplete="one-time-code" inputmode="numeric" pattern="\d{6}" maxlength="6" required>
    <button type="submit" data-t="signIn"></button>
    <button type="button" class="link" id="change-email" data-t="changeEmail"></button>
  </form>

  <div id="social" style="display: grid; gap: 16px">
    <div class="divider" data-t="or"></div>
    <a class="google" href="/sign-in/google" data-t="google"></a>
  </div>
</main>
<script>
  // Connexion des outils techniques (console, Grafana, ArgoCD, Swagger) : API web d'identity, même session que l'app.
  const TEXTS = {
    fr: {
      tools: 'Outils', title: 'Connexion', intro: 'Accès aux outils techniques. Un code te sera envoyé par email.',
      email: 'Email', sendCode: 'Recevoir un code', code: 'Code reçu par email', signIn: 'Se connecter',
      changeEmail: 'Changer d’email', or: 'ou', google: 'Continuer avec Google',
      codeSent: 'Code envoyé à {email}.', signedIn: 'Tu es connecté. Retourne sur l’outil pour continuer.',
      invalidEmail: 'Saisis une adresse email valide.', invalidCode: 'Le code contient 6 chiffres.',
      wrongCode: 'Code incorrect ou expiré.', suspended: 'Ce compte est suspendu.', failed: 'La connexion a échoué. Réessaie.',
    },
    en: {
      tools: 'Tools', title: 'Sign in', intro: 'Access to the technical tools. We will email you a code.',
      email: 'Email', sendCode: 'Get a code', code: 'Code from the email', signIn: 'Sign in',
      changeEmail: 'Use another email', or: 'or', google: 'Continue with Google',
      codeSent: 'Code sent to {email}.', signedIn: 'You are signed in. Go back to the tool to continue.',
      invalidEmail: 'Enter a valid email address.', invalidCode: 'The code has 6 digits.',
      wrongCode: 'Wrong or expired code.', suspended: 'This account is suspended.', failed: 'Sign-in failed. Try again.',
    },
  }
  const language = navigator.language && navigator.language.toLowerCase().startsWith('fr') ? 'fr' : 'en'
  const t = (key, values = {}) => TEXTS[language][key].replace(/\{(\w+)\}/g, (_, name) => values[name] ?? '')
  document.documentElement.lang = language
  document.querySelectorAll('[data-t]').forEach((node) => { node.textContent = t(node.dataset.t) })

  const $ = (id) => document.getElementById(id)
  const showError = (message) => { $('error').textContent = message; $('error').hidden = !message }
  const params = new URLSearchParams(location.search)
  if (params.has('signedIn')) $('intro').textContent = t('signedIn')
  if (params.has('error')) showError(params.get('error') === 'account_suspended' ? t('suspended') : t('failed'))

  const post = (path, body) => fetch(path, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify(body),
  })
  let email = ''

  $('email-form').addEventListener('submit', async (event) => {
    event.preventDefault()
    const input = $('email')
    if (!input.checkValidity()) return showError(t('invalidEmail'))
    const button = event.submitter
    button.disabled = true
    showError('')
    try {
      const response = await post('/api/auth/web/request-login-code', { email: input.value.trim() })
      if (!response.ok) return showError(t('failed'))
      email = input.value.trim()
      $('intro').textContent = t('codeSent', { email })
      $('email-form').hidden = true
      $('social').hidden = true
      $('code-form').hidden = false
      $('code').focus()
    } catch {
      showError(t('failed'))
    } finally {
      button.disabled = false
    }
  })

  $('code-form').addEventListener('submit', async (event) => {
    event.preventDefault()
    const code = $('code').value.trim()
    if (!/^\d{6}$/.test(code)) return showError(t('invalidCode'))
    const button = event.submitter
    button.disabled = true
    showError('')
    try {
      const response = await post('/api/auth/web/login-with-code', { email, code })
      if (response.ok) {
        // Session identity ouverte : reprise de l'autorisation de l'outil.
        location.assign('/sign-in/continue')
        return
      }
      showError(response.status === 403 ? t('suspended') : response.status === 400 || response.status === 401 ? t('wrongCode') : t('failed'))
    } catch {
      showError(t('failed'))
    } finally {
      button.disabled = false
    }
  })

  $('change-email').addEventListener('click', () => {
    showError('')
    $('intro').textContent = t('intro')
    $('code').value = ''
    $('code-form').hidden = true
    $('email-form').hidden = false
    $('social').hidden = false
    $('email').focus()
  })
</script>
</body>
</html>
