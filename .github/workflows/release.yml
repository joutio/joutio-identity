name: Release
on:
  # Manuel : republier sur une image de base corrigée (commits en attente de release).
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - '**.md'
jobs:
  release:
    uses: joutio/joutio-reusable-workflows/.github/workflows/service-release.yml@main
    with:
      java-version: "25"
      github-username: ${{ vars.JOUTIO_GITHUB_USERNAME }}
      service-name: identity
      # Démarrage d'entraînement du cache AOT (profil local) : valeur factice du seul secret sans défaut.
      aot-training-env: |
        JOUTIO_OAUTH2_GOOGLE_SECRET=aot-training
    secrets:
      GITHUB_PASSWORD: ${{ secrets.JOUTIO_GITHUB_TOKEN }}

